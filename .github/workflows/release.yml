name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/ctxhub ./cmd/ctxhub
          tar -C dist -czf ctxhub_${{ matrix.os }}_${{ matrix.arch }}.tar.gz ctxhub

      - uses: actions/upload-artifact@v4
        with:
          name: ctxhub_${{ matrix.os }}_${{ matrix.arch }}
          path: ctxhub_${{ matrix.os }}_${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts and checksum
        run: |
          mkdir -p out
          find artifacts -name "*.tar.gz" -exec cp {} out/ \;
          cd out && sha256sum *.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.tar.gz
            out/checksums.txt
          generate_release_notes: true
